services:
  # ── Flutter Web (Static Site) ──────────────────────────────────────────────
  - type: web
    name: al-saif-gallery
    env: static
    buildCommand: bash build.sh
    staticPublishPath: build/web
    envVars:
      - key: IR_PAGE_URL
        fromService:
          name: al-saif-ir-widgets
          type: web
          property: host
          transform: "https://{value}/ir"
    headers:
      # index.html و service worker — لا كاش أبداً
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /flutter.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      # باقي الملفات (JS, assets) — كاش طويل لأن أسماءها تتغير مع كل build
      - path: /main.dart.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /canvaskit/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── IR Widgets (Next.js) ───────────────────────────────────────────────────
  - type: web
    name: al-saif-ir-widgets
    env: node
    rootDir: ir-widgets
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
