<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  
  html {
    height: 100%;
    overflow: hidden;
  }
  
  body { 
    background: #ffffff; 
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-y: scroll !important;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    position: relative;
  }
  
  #widget-container { 
    min-height: 200vh;
    width: 100%;
    padding: 0;
    margin: 0;
    position: relative;
  }
</style>
<script src="https://irp.atnmo.com/v2/widget/widget-loader.js"></script>
</head>
<body>
<div id="widget-container"></div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var widgetType = params.get('type') || '';
  var lang = params.get('lang') || 'en';
  var viewId = params.get('id') || '';

  // rename div id to match widget type
  document.getElementById('widget-container').id = widgetType + '-widget';

  window.addEventListener('load', function() {
    if (typeof loadWidget === 'function') {
      loadWidget(widgetType, '5be9c146-613e-4141-a351-1f5e13fc5513', lang, '81a06c05-1a48-4d1b-8dbd-bcf60a76730f', 'v2');
    }
  });
  
  // Ensure body is scrollable
  document.body.style.overflow = 'scroll';
  document.body.style.webkitOverflowScrolling = 'touch';
})();
</script>
</body>
</html>
