<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    background: #ffffff; 
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  body > div { margin: 0 !important; padding: 0 !important; }
  #widget-container { 
    min-height: 100%; 
    touch-action: pan-y pan-x;
  }
</style>
<script src="https://irp.atnmo.com/v2/widget/widget-loader.js"></script>
</head>
<body>
<div id="widget-container"></div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var widgetType = params.get('type') || '';
  var lang = params.get('lang') || 'en';
  var viewId = params.get('id') || '';

  // rename div id to match widget type
  document.getElementById('widget-container').id = widgetType + '-widget';

  window.addEventListener('load', function() {
    if (typeof loadWidget === 'function') {
      loadWidget(widgetType, '5be9c146-613e-4141-a351-1f5e13fc5513', lang, '81a06c05-1a48-4d1b-8dbd-bcf60a76730f', 'v2');
    }
  });

  // Mobile scroll fix: forward touch events to parent
  var touchStartY = 0;
  var touchStartX = 0;
  
  document.addEventListener('touchstart', function(e) {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  
  document.addEventListener('touchmove', function(e) {
    var touchY = e.touches[0].clientY;
    var touchX = e.touches[0].clientX;
    var deltaY = touchStartY - touchY;
    var deltaX = touchStartX - touchX;
    
    // If vertical scroll is dominant, notify parent
    if (Math.abs(deltaY) > Math.abs(deltaX)) {
      window.parent.postMessage({
        type: 'scroll',
        deltaY: deltaY,
        deltaX: 0
      }, '*');
    }
  }, { passive: true });
})();
</script>
</body>
</html>
