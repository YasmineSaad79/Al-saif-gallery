  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%238B0000' stroke='%23600000' stroke-width='2'/><ellipse cx='50' cy='50' rx='20' ry='48' fill='none' stroke='white' stroke-width='2.5'/><line x1='2' y1='50' x2='98' y2='50' stroke='white' stroke-width='2.5'/><line x1='10' y1='25' x2='90' y2='25' stroke='white' stroke-width='2'/><line x1='10' y1='75' x2='90' y2='75' stroke='white' stroke-width='2'/><circle cx='50' cy='50' r='48' fill='none' stroke='%23600000' stroke-width='2'/></svg>"/>

  <link rel="manifest" href="manifest.json">
  <style>
    ::selection { background: #1f415c; color: inherit; }
    ::-moz-selection { background: #406583; color: inherit; }

    /* Remove 300ms tap delay on all elements */
    * { touch-action: manipulation; }

    html, body { touch-action: manipulation; }

    /* CSS cursor for clickable Flutter elements - faster than Dart MouseRegion */
    flt-glass-pane { cursor: default; }
    [flt-semantics-role="button"],
    [aria-role="button"] { cursor: pointer; }

    /* Allow text selection inside iframes embedded via Flutter Web */
    iframe {
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
    }
  </style>

  <script>
    // Unregister any old service workers to prevent stale cache issues
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
      caches.keys().then(function(keys) {
        keys.forEach(function(key) { caches.delete(key); });
      });
    }
  </script>
  <script>
    // Fix: Flutter's flt-glass-pane sits on top of platform views (iframes) and
    // blocks all mouse/touch events including text selection.
    // We temporarily disable pointer-events on the glass pane when the cursor
    // is over an iframe, restoring them when it leaves.
    document.addEventListener('DOMContentLoaded', function () {
      var observer = new MutationObserver(function () {
        var glassPane = document.querySelector('flt-glass-pane');
        if (!glassPane) return;
        observer.disconnect();

        document.addEventListener('mouseover', function (e) {
          if (e.target && e.target.tagName === 'IFRAME') {
            glassPane.style.pointerEvents = 'none';
          }
        }, true);

        document.addEventListener('mouseout', function (e) {
          if (e.target && e.target.tagName === 'IFRAME') {
            glassPane.style.pointerEvents = '';
          }
        }, true);
      });

      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
