<!DOCTYPE html>
<html>
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Al Saif Gallery">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%238B0000' stroke='%23600000' stroke-width='2'/><ellipse cx='50' cy='50' rx='20' ry='48' fill='none' stroke='white' stroke-width='2.5'/><line x1='2' y1='50' x2='98' y2='50' stroke='white' stroke-width='2.5'/><line x1='10' y1='25' x2='90' y2='25' stroke='white' stroke-width='2'/><line x1='10' y1='75' x2='90' y2='75' stroke='white' stroke-width='2'/><circle cx='50' cy='50' r='48' fill='none' stroke='%23600000' stroke-width='2'/></svg>"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://irp.atnmo.com">

  <style>
    ::selection { background: #1f415c; color: inherit; }
    ::-moz-selection { background: #406583; color: inherit; }
    * { touch-action: manipulation; }
    html, body { touch-action: manipulation; }
    iframe { user-select: text; -webkit-user-select: text; }
  </style>
  <script>
    // Global functions called directly from Dart via dart:html
    window.disableAllIframes = function() {
      window._iframesManuallyDisabled = true;
      document.querySelectorAll('iframe').forEach(function(f) {
        f.style.pointerEvents = 'none';
      });
    };
    window.enableAllIframes = function() {
      window._iframesManuallyDisabled = false;
      document.querySelectorAll('iframe').forEach(function(f) {
        f.style.pointerEvents = 'auto';
      });
    };
    window._iframesManuallyDisabled = false;
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) { r.forEach(function(x){x.unregister();}); });
      caches.keys().then(function(k) { k.forEach(function(x){caches.delete(x);}); });
    }
  </script>
  <script>
    // بعد ما يخسر الـ window الـ focus للـ iframe، ارجعه
    window.addEventListener('blur', function() {
      setTimeout(function() { window.focus(); }, 50);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Hidden container for preloading ALL IR widgets -->
  <div id="ir-widgets-preload" style="position: fixed; left: -9999px; top: -9999px; width: 1000px; height: 5000px; opacity: 0; pointer-events: none; overflow: hidden;"></div>
  
  <script>
    // تحميل جميع الويدجتات في الخلفية فوراً
    (function() {
      var widgetsToPreload = [
        'stock-ticker',
        'company-snapshot',
        'corporate-news',
        'fact-sheet',
        'stock-activity',
        'corporate-actions',
        'company-financials',
        'share-price',
        'performance',
        'investment-calculator',
        'share-series',
        'zakat-calculator',
        'share-view',
        'price-lookup',
        'peer-group-analysis',
        'email-subscription'
      ];
      
      window.addEventListener('load', function() {
        setTimeout(function() {
          var script = document.createElement('script');
          script.src = 'https://irp.atnmo.com/v3/widget/widget-loader.js';
          script.onload = function() {
            if (typeof loadWidget === 'function') {
              var container = document.getElementById('ir-widgets-preload');
              
              // حمّل كل ويدجت بتأخير بسيط بينهم
              widgetsToPreload.forEach(function(widgetType, index) {
                setTimeout(function() {
                  var widgetDiv = document.createElement('div');
                  widgetDiv.id = widgetType + '-widget-preload';
                  widgetDiv.style.marginBottom = '20px';
                  container.appendChild(widgetDiv);
                  
                  loadWidget(
                    widgetType,
                    "5be9c146-613e-4141-a351-1f5e13fc5513",
                    "en",
                    "81a06c05-1a48-4d1b-8dbd-bcf60a76730f",
                    "v3"
                  );
                  
                  console.log('Preloaded: ' + widgetType);
                }, index * 300); // 300ms بين كل ويدجت
              });
              
              window._irWidgetsPreloaded = true;
              console.log('All IR widgets preloading started');
            }
          };
          document.head.appendChild(script);
        }, 1500); // ابدأ بعد 1.5 ثانية من تحميل الصفحة
      });
    })();
  </script>
</head>

</body>
