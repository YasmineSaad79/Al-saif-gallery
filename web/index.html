<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Al Saif Gallery -- Saudi Arabia's dominant specialty retailer in household and kitchen appliances. 73 stores, SAR 758.8M revenue, approximately 88% proprietary brands. Tadawul-listed since 2022.">
  <link rel="canonical" href="https://alsaifgallery.com/en/">
  <title>Al Saif Gallery | Saudi Arabia's Home & Kitchen Retail Leader | Tadawul 4192</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Al Saif Gallery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%238B0000' stroke='%23600000' stroke-width='2'/><ellipse cx='50' cy='50' rx='20' ry='48' fill='none' stroke='white' stroke-width='2.5'/><line x1='2' y1='50' x2='98' y2='50' stroke='white' stroke-width='2.5'/><line x1='10' y1='25' x2='90' y2='25' stroke='white' stroke-width='2'/><line x1='10' y1='75' x2='90' y2='75' stroke='white' stroke-width='2'/><circle cx='50' cy='50' r='48' fill='none' stroke='%23600000' stroke-width='2'/></svg>"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://irp.atnmo.com">
  <link rel="dns-prefetch" href="https://irp.atnmo.com">
  <style>
    ::selection { background: #1f415c; color: inherit; }
    ::-moz-selection { background: #406583; color: inherit; }
    * { touch-action: manipulation; }
    html, body { touch-action: manipulation; }
    iframe { user-select: text; -webkit-user-select: text; }
    /* Flutter always on top of iframes */
    flt-glass-pane, flutter-view, flt-scene-host {
      z-index: 9999 !important;
      position: relative !important;
    }
    iframe {
      z-index: 1 !important;
      position: relative !important;
    }
  </style>
  <script>
    // Global functions called directly from Dart via dart:html
    window.disableAllIframes = function() {
      window._iframesManuallyDisabled = true;
      document.querySelectorAll('iframe').forEach(function(f) {
        f.style.pointerEvents = 'none';
      });
    };
    window.enableAllIframes = function() {
      window._iframesManuallyDisabled = false;
      document.querySelectorAll('iframe').forEach(function(f) {
        f.style.pointerEvents = 'auto';
      });
    };
    window._iframesManuallyDisabled = false;
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) { r.forEach(function(x){x.unregister();}); });
      caches.keys().then(function(k) { k.forEach(function(x){caches.delete(x);}); });
    }
  </script>
  <script>
    // Preload IR widgets
    window.addEventListener('load', function() {
      setTimeout(function() {
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'https://irp.atnmo.com/v2/widget/widget-loader.js';
        document.head.appendChild(link);
      }, 2000);
    });
  </script>
  <script>
    // استقبل wheel من الـ iframes وحوّله لـ Flutter
    window.addEventListener('message', function(e) {
      if (!e.data) return;
      var type = e.data.type;
      if (type === 'iframe-wheel') {
        var dy = e.data.deltaY || 0;
        var gp = document.querySelector('flt-glass-pane');
        if (gp) gp.dispatchEvent(new WheelEvent('wheel', {
          deltaY: dy, deltaMode: 0,
          bubbles: true, cancelable: true, composed: true
        }));
      }
    });

    // بعد ما يخسر الـ window الـ focus للـ iframe، ارجعه
    window.addEventListener('blur', function() {
      setTimeout(function() { window.focus(); }, 50);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
