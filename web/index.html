  <style>
    ::selection { background: #1f415c; color: inherit; }
    ::-moz-selection { background: #406583; color: inherit; }
    * { touch-action: manipulation; }
    html, body { touch-action: manipulation; }
    iframe {
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
      caches.keys().then(function(keys) {
        keys.forEach(function(key) { caches.delete(key); });
      });
    }
  </script>
  <script>
    // Forward iframe-wheel messages to Flutter glass pane for scrolling
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'iframe-wheel') {
        var dy = e.data.deltaY || 0;
        var target = document.querySelector('flt-glass-pane') || document.body;
        target.dispatchEvent(new WheelEvent('wheel', {
          deltaY: dy, deltaMode: 0, bubbles: true, cancelable: true
        }));
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      var observer = new MutationObserver(function () {
        var glassPane = document.querySelector('flt-glass-pane');
        if (!glassPane) return;
        observer.disconnect();

        // iframe pointer events for iframes
        document.addEventListener('mouseover', function (e) {
          if (e.target && e.target.tagName === 'IFRAME') {
            glassPane.style.pointerEvents = 'none';
          }
        }, true);
        document.addEventListener('mouseout', function (e) {
          if (e.target && e.target.tagName === 'IFRAME') {
            glassPane.style.pointerEvents = '';
          }
        }, true);
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
