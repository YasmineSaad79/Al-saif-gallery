<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Al Saif Gallery -- Saudi Arabia's dominant specialty retailer in household and kitchen appliances. 73 stores, SAR 758.8M revenue, approximately 88% proprietary brands. Tadawul-listed since 2022.">
  <link rel="canonical" href="https://alsaifgallery.com/en/">
  <title>Al Saif Gallery | Saudi Arabia's Home & Kitchen Retail Leader | Tadawul 4192</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Al Saif Gallery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%238B0000' stroke='%23600000' stroke-width='2'/><ellipse cx='50' cy='50' rx='20' ry='48' fill='none' stroke='white' stroke-width='2.5'/><line x1='2' y1='50' x2='98' y2='50' stroke='white' stroke-width='2.5'/><line x1='10' y1='25' x2='90' y2='25' stroke='white' stroke-width='2'/><line x1='10' y1='75' x2='90' y2='75' stroke='white' stroke-width='2'/><circle cx='50' cy='50' r='48' fill='none' stroke='%23600000' stroke-width='2'/></svg>"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://irp.atnmo.com">
  <link rel="dns-prefetch" href="https://irp.atnmo.com">
  <style>
    ::selection { background: #1f415c; color: inherit; }
    ::-moz-selection { background: #406583; color: inherit; }
    * { touch-action: manipulation; }
    html, body { touch-action: manipulation; }
    iframe { user-select: text; -webkit-user-select: text; }
    /* Flutter always on top of iframes */
    flt-glass-pane, flutter-view, flt-scene-host {
      z-index: 9999 !important;
      position: relative !important;
    }
    iframe {
      z-index: 1 !important;
      position: relative !important;
    }
  </style>
  <script>
    // Global functions called directly from Dart via dart:html
    window.disableAllIframes = function() {
      window._iframesManuallyDisabled = true;
      document.querySelectorAll('iframe').forEach(function(f) {
        f.style.pointerEvents = 'none';
      });
    };
    window.enableAllIframes = function() {
      window._iframesManuallyDisabled = false;
      document.querySelectorAll('iframe').forEach(function(f) {
        f.style.pointerEvents = 'auto';
      });
    };
    window._iframesManuallyDisabled = false;
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) { r.forEach(function(x){x.unregister();}); });
      caches.keys().then(function(k) { k.forEach(function(x){caches.delete(x);}); });
    }
  </script>
  <script>
    // Preload IR widgets by prefetching the widget loader script
    window.addEventListener('load', function() {
      setTimeout(function() {
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'https://irp.atnmo.com/v2/widget/widget-loader.js';
        document.head.appendChild(link);
      }, 2000);
    });
  </script>
  <script>
    // Forward iframe-wheel to irScrollController
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'iframe-wheel') {
        var dy = e.data.deltaY || 0;
        var gp = document.querySelector('flt-glass-pane');
        if (gp) gp.dispatchEvent(new WheelEvent('wheel', {deltaY: dy, deltaMode: 0, bubbles: true, cancelable: true, composed: true}));
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var observer = new MutationObserver(function() {
        var gp = document.querySelector('flt-glass-pane');
        if (!gp) return;
        observer.disconnect();

        var scrollTimer = null;

        // Disable iframe pointer-events during scroll
        gp.addEventListener('wheel', function(e) {
          window.disableAllIframes();
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(function() {
            window.enableAllIframes();
          }, 300);
        }, { passive: true });

        // Smart iframe pointer-events: only disable during scroll
        // On mobile, iframes stay enabled unless manually disabled by Dart
        var isMobile = /Mobi|Android/i.test(navigator.userAgent);
        if (!isMobile) {
          document.addEventListener('mousemove', function(e) {
            if (window._iframesManuallyDisabled) return;
            var els = document.elementsFromPoint(e.clientX, e.clientY);
            var topEl = els[0];
            if (topEl && topEl.tagName === 'IFRAME') {
              document.querySelectorAll('iframe').forEach(function(f) {
                f.style.pointerEvents = 'auto';
              });
            } else {
              document.querySelectorAll('iframe').forEach(function(f) {
                f.style.pointerEvents = 'none';
              });
            }
          });
        }

      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
